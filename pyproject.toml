[project]
name = "factordesk"
version = "0.1.0"
description = "factordesk: Fama-French 5-factor analyzer for single tickers"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pandas",
    "numpy",
    "statsmodels",
    "scipy",
    "yfinance",
    "pydantic-settings",
    "pyarrow",
    "httpx",
    "python-multipart",
]

[project.scripts]
factordesk = "factordesk.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/factordesk"]
# Tests and their fixtures stay in the source archive only.
exclude = ["backend/factordesk/tests"]
# The report renderer reads its stylesheet and fonts from the package directory.
artifacts = [
    "backend/factordesk/report/report.css",
    "backend/factordesk/report/fonts/*",
    # The built dashboard, copied in by "npm --prefix frontend run build:package" (gitignored).
    "backend/factordesk/web/**",
]

[tool.hatch.build.targets.sdist]
include = ["backend", "hatch_build.py", "LICENSE"]
artifacts = ["backend/factordesk/web/**"]

# Fails a wheel build when the dashboard was not copied in (see hatch_build.py).
[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "pyright",
    "pandas-stubs",
    "poethepoet>=0.49.0",
]

# Shortcuts: `uv run poe` lists them, `uv run poe <task>` runs one. The Makefile calls the same tasks.
[tool.poe.tasks.setup]
help = "Install the page's dependencies and build the dashboard page (run uv sync first)"
sequence = [
    "python scripts/tasks.py npm --prefix frontend ci",
    "python scripts/tasks.py npm --prefix frontend run build",
]
default_item_type = "cmd"

[tool.poe.tasks.build]
help = "Rebuild the dashboard page (after frontend changes)"
cmd = "python scripts/tasks.py npm --prefix frontend run build"

[tool.poe.tasks.serve]
help = "Start the dashboard and open it in the browser"
cmd = "factordesk serve --port ${port} --open"
args = [{ name = "port", default = "8000", help = "Port to listen on" }]

[tool.poe.tasks.stop]
help = "Stop the factordesk server on a port"
cmd = "python scripts/tasks.py stop --port ${port}"
args = [{ name = "port", default = "8000", help = "Port the server listens on" }]

[tool.poe.tasks.dev]
help = "Start the API with reload for frontend development (run 'npm --prefix frontend run dev' too)"
cmd = "factordesk serve --dev"

[tool.poe.tasks.report]
help = "Write an offline HTML report for a ticker and open it"
cmd = "factordesk report ${ticker} --open"
args = [{ name = "ticker", positional = true, required = true, help = "Yahoo Finance symbol, for example SPY" }]

[tool.poe.tasks.factors]
help = "Show the date range, age and source of the cached factor file"
cmd = "factordesk factors status"

[tool.poe.tasks.refresh-factors]
help = "Download the latest factor file now"
cmd = "factordesk factors refresh"

[tool.poe.tasks.test]
help = "Run the Python and frontend unit tests"
sequence = ["pytest -q", "python scripts/tasks.py npm --prefix frontend test"]
default_item_type = "cmd"

[tool.poe.tasks.check]
help = "Lint, format check and type check (Python and frontend), as CI does"
sequence = [
    "ruff check",
    "ruff format --check backend",
    "pyright",
    "python scripts/tasks.py npm --prefix frontend run typecheck",
    "python scripts/tasks.py npm --prefix frontend run lint",
]
default_item_type = "cmd"

[tool.poe.tasks.e2e]
help = "Run the browser tests (Playwright, against a fake backend)"
cmd = "python scripts/tasks.py npm --prefix frontend run e2e"

[tool.poe.tasks.ci]
help = "Every gate CI runs: check, test, build, bundle size, e2e"
sequence = ["check", "test", "build", "_size", "e2e"]

[tool.poe.tasks._size]
cmd = "python scripts/tasks.py npm --prefix frontend run size"

[tool.ruff]
line-length = 100
target-version = "py312"
# Throwaway design prototype generator; not part of the package.
extend-exclude = ["docs/design/prototype"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "PD"]

[tool.pyright]
typeCheckingMode = "strict"
include = ["backend"]
venvPath = "."
venv = ".venv"
extraPaths = ["backend"]

[tool.pytest.ini_options]
testpaths = ["backend/factordesk/tests"]
markers = [
    "live: hits the network (French library, Yahoo); run with -m live",
    "slow: Monte Carlo and seed sweeps (test-oracle 0.1-0.2); run with -m slow",
]
addopts = "-m 'not live and not slow'"
