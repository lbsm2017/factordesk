[project]
name = "factordesk"
version = "0.1.0"
description = "factordesk: Fama-French 5-factor analyzer for single tickers"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pandas",
    "numpy",
    "statsmodels",
    "scipy",
    "yfinance",
    "pydantic-settings",
    "pyarrow",
    "httpx",
]

[project.scripts]
factordesk = "factordesk.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/factordesk"]
# The report renderer reads its stylesheet and fonts from the package directory.
artifacts = ["backend/factordesk/report/report.css", "backend/factordesk/report/fonts/*"]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "pyright",
    "pandas-stubs",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# Throwaway design prototype generator; not part of the package.
extend-exclude = ["docs/design/prototype"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "PD"]

[tool.pyright]
typeCheckingMode = "strict"
include = ["backend"]
venvPath = "."
venv = ".venv"
extraPaths = ["backend"]

[tool.pytest.ini_options]
testpaths = ["backend/factordesk/tests"]
markers = [
    "live: hits the network (French library, Yahoo); run with -m live",
    "slow: Monte Carlo and seed sweeps (test-oracle 0.1-0.2); run with -m slow",
]
addopts = "-m 'not live and not slow'"
