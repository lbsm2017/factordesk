name: nightly

# Runs the tests that normal CI skips (pyproject.toml deselects `slow` and `live` by default).
on:
  schedule:
    - cron: "17 3 * * *" # 03:17 UTC every day
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.workflow }}
  cancel-in-progress: false

env:
  UV_PYTHON: "3.12"

jobs:
  # Monte Carlo and seed-sweep tests. A failure fails the job; GitHub emails the owner
  # about failed scheduled runs. No network is used.
  slow:
    name: slow
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # The Kalman simulation tests default to 100 replications; the spec asks for 200.
      FACTORDESK_KB_REPS: "200"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@6b9c6063abd6010835644d4c2e1bef4cf5cd0fca # v6.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked
      - run: uv run pytest -m slow -q

  # Tests that call Yahoo and the Ken French library. Network or format trouble at a
  # provider is not a code bug, so this job may fail without failing the workflow.
  live:
    name: live
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@6b9c6063abd6010835644d4c2e1bef4cf5cd0fca # v6.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked
      - name: Run live tests
        id: pytest
        continue-on-error: true
        run: uv run pytest -m live -q
      - name: Write job summary
        if: always()
        run: |
          if [ "${{ steps.pytest.outcome }}" = "success" ]; then
            echo "### live tests: passed" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### live tests: did not pass (outcome: ${{ steps.pytest.outcome }})" >> "$GITHUB_STEP_SUMMARY"
            echo "This job is allowed to fail. Check whether Yahoo or the Ken French library changed before suspecting the code." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Mark the job red when the tests did not pass
        if: steps.pytest.outcome != 'success'
        run: exit 1
